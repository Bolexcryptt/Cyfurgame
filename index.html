<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05080e">
    <title>CY-FUR // Light Protocol — Scene Preview</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</head>
<body>
    <main class="scene-preview" aria-label="CY-FUR light puzzle scene preview">
        <canvas id="scene-canvas" aria-label="Three-dimensional ruined optical chamber. Drag to orbit the camera and scroll or pinch to zoom."></canvas>
        <nav class="camera-tools" aria-label="Camera controls">
            <span>CAMERA</span>
            <button id="camera-left" type="button" aria-label="Rotate camera left" title="Rotate left">↶</button>
            <button id="camera-right" type="button" aria-label="Rotate camera right" title="Rotate right">↷</button>
            <button id="camera-up" type="button" aria-label="Tilt camera up" title="Tilt up">↑</button>
            <button id="camera-down" type="button" aria-label="Tilt camera down" title="Tilt down">↓</button>
            <button id="camera-reset" class="reset-camera" type="button">RESET VIEW</button>
        </nav>
        <p class="gesture-hint">DRAG TO ORBIT <span>·</span> SCROLL / PINCH TO ZOOM</p>
        <section class="game-hud" aria-label="Puzzle controls">
            <div class="game-instructions">
                <span class="hud-kicker">LIGHT ROUTING</span>
                <strong id="game-status-title">Route the beam to the core</strong>
                <p id="game-status" role="status" aria-live="polite">Tap or click an open floor tile to place a mirror. Tap it again to rotate.</p>
            </div>
            <div class="game-actions">
                <button id="reset-game" class="game-button secondary" type="button">RESET</button>
                <button id="trace-beam" class="game-button primary" type="button"><span>▶</span> POWER SOURCE</button>
            </div>
        </section>
        <p id="load-error" class="load-error" hidden></p>
    </main>
</body>
</html>
